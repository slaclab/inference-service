# copier-template-k8s/deployment.yaml.jinja

---
# ConfigMap for iris-model-service
apiVersion: v1
kind: ConfigMap
metadata:
  name: iris-model-service-config
  namespace: inference-service
data:
  MLFLOW_TRACKING_URI: "https://ard-mlflow.slac.stanford.edu/"
  MODEL_NAME: "iris-model"
  MODEL_VERSION: "1"

---
# Deployment for iris-model-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-model-service
  namespace: inference-service
  labels:
    app: iris-model-service
    model: iris-model
    version: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iris-model-service
  template:
    metadata:
      labels:
        app: iris-model-service
        model: iris-model
        version: "1"
    spec:
      containers:
      - name: inference
        image: ghcr.io/slaclab/inference-service/inference-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: MLFLOW_TRACKING_URI
          valueFrom:
            configMapKeyRef:
              name: iris-model-service-config
              key: MLFLOW_TRACKING_URI
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: iris-model-service-config
              key: MODEL_NAME
        - name: MODEL_VERSION
          valueFrom:
            configMapKeyRef:
              name: iris-model-service-config
              key: MODEL_VERSION
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

---
# Service for iris-model-service
apiVersion: v1
kind: Service
metadata:
  name: iris-model-service
  namespace: inference-service
  labels:
    app: iris-model-service
spec:
  type: ClusterIP
  selector:
    app: iris-model-service
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP